name: Release

# Pushing a tag such as v1.2.0:
#   1. runs the tests,
#   2. builds Quadra.zip signed with the Developer ID certificate and notarized by Apple,
#   3. publishes it as a GitHub release, with notes from CHANGELOG.md,
#   4. updates the Homebrew cask in vulpini-br/homebrew-tap.
# Running it by hand ("Run workflow") is a rehearsal: steps 1 and 2 only, nothing is published.
#
# Secrets: QUADRA_DEVID_P12 (base64 of the Developer ID Application .p12), QUADRA_DEVID_PASSWORD,
# QUADRA_NOTARY_APPLE_ID and QUADRA_NOTARY_PASSWORD (an app-specific password of that Apple
# Account, for notarization), TAP_DEPLOY_KEY (SSH key with write access to the tap).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      - name: Load the signing certificate
        env:
          CERT_P12: ${{ secrets.QUADRA_DEVID_P12 }}
          CERT_PASSWORD: ${{ secrets.QUADRA_DEVID_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/quadra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/quadra.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/quadra.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Apple's intermediate certificate for Developer ID, in case the runner lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/quadra.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "QUADRA_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "QUADRA_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign and notarize Quadra.zip
        env:
          QUADRA_NOTARY_APPLE_ID: ${{ secrets.QUADRA_NOTARY_APPLE_ID }}
          QUADRA_NOTARY_PASSWORD: ${{ secrets.QUADRA_NOTARY_PASSWORD }}
          QUADRA_NOTARY_TEAM: AE7E7GAZLV
        run: ./build.sh --zip

      - name: Check the signature and Apple's ticket
        run: |
          codesign --verify --strict --verbose=2 build/Quadra.app
          codesign -dv build/Quadra.app 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier)="
          codesign -d -r- build/Quadra.app 2>&1 | grep designated
          xcrun stapler validate build/Quadra.app
          spctl --assess --type execute --verbose=2 build/Quadra.app

      - name: Keep the rehearsal build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Quadra-rehearsal
          path: build/Quadra.zip

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Tools/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" build/Quadra.zip --title "Quadra $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest

      - name: Update the Homebrew cask
        if: github.event_name == 'push'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(shasum -a 256 build/Quadra.zip | cut -d' ' -f1)"
          KEY="$RUNNER_TEMP/tap_key"
          echo "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:vulpini-br/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/quadra.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quadra $VERSION"
          git push
          rm -f "$KEY"
